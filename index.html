
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calories Calculator V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing:border-box; }
body {
  margin:0; padding:24px 18px;
  background:#101827; color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
main { max-width:600px; margin:auto; }
h1 { font-size:27px; }
.card {
  background:#1e293b; padding:20px;
  border-radius:18px; margin:18px 0;
}
label {
  display:block; margin-top:14px; color:#cbd5e1;
}
input,select {
  width:100%; padding:13px; margin-top:7px;
  border:0; border-radius:10px; font-size:16px;
}
button {
  width:100%; padding:14px; margin-top:14px;
  background:#38bdf8; border:0; border-radius:10px;
  font-size:16px; font-weight:bold; cursor:pointer;
}
.secondary { background:#475569; color:white; }
.google { background:white; color:#222; }
.result { font-size:29px; font-weight:bold; color:#38bdf8; }
.small { color:#94a3b8; font-size:13px; }
.hidden { display:none; }
.status { color:#86efac; white-space:pre-wrap; }
</style>
</head>
<body>
<main>

<h1>🔥 Calories Calculator V2</h1>
<p class="small">個人每日熱量計算與雲端管理系統</p>

<div class="card" id="authCard">
<h2>🔐 會員登入</h2>

<label>Email</label>
<input id="email" type="email" placeholder="請輸入 Email">

<label>密碼</label>
<input id="password" type="password" placeholder="至少 8 個字元">

<button onclick="signIn()">Email 登入</button>
<button class="secondary" onclick="signUp()">建立新帳號</button>
<button class="google" onclick="googleLogin()">使用 Google 登入</button>

<p class="small" id="authMessage"></p>
</div>

<div id="app" class="hidden">

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2>👤 個人基本資料</h2>
<button class="secondary" style="width:auto;margin:0;padding:9px 14px" onclick="signOut()">登出</button>
</div>

<p class="small" id="userEmail"></p>

<label>使用者名稱</label>
<input id="name" value="使用者">

<label>性別</label>
<select id="sex">
<option value="male">男性</option>
<option value="female">女性</option>
</select>

<label>出生日期</label>
<input id="birth" type="date" value="1991-01-01">

<label>身高 (cm)</label>
<input id="height" type="number" value="170" step="0.1">

<label>體重 (kg)</label>
<input id="weight" type="number" value="65" step="0.1">

<label>活動程度</label>
<select id="activity">
<option value="1.2">久坐，少運動</option>
<option value="1.375">輕度活動</option>
<option value="1.55" selected>中度活動</option>
<option value="1.725">高度活動</option>
<option value="1.9">非常高度活動</option>
</select>

<button onclick="saveProfile()">儲存雲端資料並計算</button>
<p class="small status" id="saveMessage"></p>
</div>

<div class="card">
<h2>📊 計算結果</h2>

<p>目前年齡</p>
<div class="result" id="age">--</div>

<p>基礎代謝率 BMR</p>
<div class="result" id="bmr">--</div>
<p class="small">kcal / 日</p>

<p>每日總消耗熱量 TDEE</p>
<div class="result" id="tdee">--</div>
<p class="small">kcal / 日</p>
</div>

</div>
</main>

<script>
// Supabase 連線設定
const SUPABASE_URL =
"https://ptdwnhmspaxzbypjvhes.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bqjES-NS5H1MHTxovYCvPA_tvlYQBhO";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ids = [
  "name","sex","birth","height","weight"
];

function calculateAge(date) {
  const birth = new Date(date + "T00:00:00");
  const today = new Date();

  let age = today.getFullYear() - birth.getFullYear();

  if (
    today.getMonth() < birth.getMonth() ||
    (today.getMonth() === birth.getMonth() &&
    today.getDate() < birth.getDate())
  ) age--;

  return age;
}

function calculate() {
  const birth = document.getElementById("birth").value;
  const sex = document.getElementById("sex").value;
  const height = Number(document.getElementById("height").value);
  const weight = Number(document.getElementById("weight").value);
  const activity = Number(document.getElementById("activity").value);

  if (!birth || !height || !weight ||
      height <= 0 || weight <= 0) {
    throw new Error("請確認生日、身高及體重資料");
  }

  const age = calculateAge(birth);

  if (age < 0) throw new Error("出生日期不正確");

  const bmr =
    10 * weight + 6.25 * height - 5 * age +
    (sex === "male" ? 5 : -161);

  const tdee = bmr * activity;

  document.getElementById("age").textContent = age + " 歲";
  document.getElementById("bmr").textContent =
    Math.round(bmr).toLocaleString();

  document.getElementById("tdee").textContent =
    Math.round(tdee).toLocaleString();

  return { age, bmr, tdee };
}

// Email 註冊
async function signUp() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || password.length < 8) {
    return showAuth("請輸入 Email，密碼至少 8 個字元");
  }

  const { error } = await db.auth.signUp({
    email,
    password
  });

  if (error) return showAuth(error.message);

  showAuth("註冊完成！若需要 Email 驗證，請先收取驗證信，再登入。");
}

// Email 登入
async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) return showAuth(error.message);

  await loadProfile();
}

// Google 登入
async function googleLogin() {
  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin +
        window.location.pathname
    }
  });

  if (error) showAuth(error.message);
}

function showAuth(message) {
  document.getElementById("authMessage").textContent = message;
}

// 載入雲端個人資料
async function loadProfile() {
  const { data: { user } } = await db.auth.getUser();

  if (!user) return;

  document.getElementById("authCard").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("userEmail").textContent = user.email || "";

  const { data, error } = await db
    .from("profiles")
    .select("name,gender,birth_date,height_cm,weight_kg")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    document.getElementById("saveMessage").textContent =
      "讀取資料失敗：" + error.message;
    return;
  }

  if (data) {
    document.getElementById("name").value = data.name || "使用者";
    document.getElementById("sex").value = data.gender || "male";
    document.getElementById("birth").value =
      data.birth_date || "1991-01-01";
    document.getElementById("height").value =
      data.height_cm || 170;
    document.getElementById("weight").value =
      data.weight_kg || 65;
  }

  calculate();
}

// 儲存雲端個人資料
async function saveProfile() {
  const message = document.getElementById("saveMessage");

  try {
    const { data: { user }, error: userError } =
      await db.auth.getUser();

    if (userError || !user) {
      throw new Error("請先登入");
    }

    calculate();

    const profile = {
      id: user.id,
      name: document.getElementById("name").value.trim(),
      gender: document.getElementById("sex").value,
      birth_date: document.getElementById("birth").value,
      height_cm: Number(document.getElementById("height").value),
      weight_kg: Number(document.getElementById("weight").value)
    };

    if (!profile.name) {
      throw new Error("請輸入使用者名稱");
    }

    const { error } = await db
      .from("profiles")
      .upsert(profile, { onConflict: "id" });

    if (error) throw error;

    localStorage.setItem(
      "calorieProfile",
      JSON.stringify(profile)
    );

    message.textContent = "✓ 雲端資料儲存成功！";

  } catch (error) {
    message.textContent = "儲存失敗：" + error.message;
  }
}

// 登出
async function signOut() {
  const { error } = await db.auth.signOut();

  if (error) {
    showAuth(error.message);
    return;
  }

  document.getElementById("app").classList.add("hidden");
  document.getElementById("authCard").classList.remove("hidden");
}

// 初始化登入狀態
async function init() {
  const { data: { session } } = await db.auth.getSession();

  if (session) {
    await loadProfile();
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session) {
    loadProfile();
  }
});

init();
</script>
</body>
</html>
